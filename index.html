<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Status Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .status-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #0f172a;
        }

        .status-online { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-idle { background-color: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .status-dnd { background-color: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .status-offline { background-color: #94a3b8; }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0px rgba(34, 197, 94, 0.4); }
            100% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <div id="discord-card" class="glass-card p-6 rounded-3xl w-full max-w-sm transition-all duration-500 hover:scale-105">
        <div class="flex items-center space-x-4">
            <div class="relative">
                <img id="avatar" src="https://via.placeholder.com/80" alt="Avatar" class="w-20 h-20 rounded-2xl object-cover border-2 border-slate-700">
                <div id="status-indicator" class="status-dot absolute bottom-1 right-1 rounded-full"></div>
            </div>

            <div class="flex-1">
                <h2 id="username" class="text-white text-xl font-bold tracking-tight">Loading...</h2>
                <p id="custom-status" class="text-slate-400 text-sm italic truncate"></p>
            </div>
        </div>

        <hr class="border-slate-800 my-4">

        <div id="activity-container" class="space-y-3">
            <div class="flex items-center space-x-3 text-slate-300">
                <i data-lucide="monitor" class="w-5 h-5 text-indigo-400"></i>
                <span id="activity-name" class="text-sm font-medium">Şu an bir şey yapmıyor</span>
            </div>
        </div>

        <div id="spotify-container" class="mt-4 p-3 bg-green-500/10 border border-green-500/20 rounded-xl hidden">
            <div class="flex items-center space-x-3">
                <div class="relative">
                    <img id="spotify-album" src="" class="w-12 h-12 rounded-lg animate-spin-slow" style="animation: spin 8s linear infinite;">
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-[10px] uppercase font-bold text-green-500 tracking-widest">Listening to Spotify</p>
                    <p id="spotify-title" class="text-white text-sm font-semibold truncate"></p>
                    <p id="spotify-artist" class="text-slate-400 text-xs truncate"></p>
                </div>
                <i data-lucide="music" class="w-5 h-5 text-green-500 animate-bounce"></i>
            </div>
        </div>
    </div>

    <script>
        const USER_ID = "461158648526143490";
        
        async function fetchLanyard() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`);
                const { data } = await response.json();

                // Update Avatar & Username
                document.getElementById('avatar').src = `https://cdn.discordapp.com/avatars/${USER_ID}/${data.discord_user.avatar}.webp?size=160`;
                document.getElementById('username').innerText = data.discord_user.global_name || data.discord_user.username;
                
                // Status Logic
                const statusMap = {
                    online: 'status-online',
                    idle: 'status-idle',
                    dnd: 'status-dnd',
                    offline: 'status-offline'
                };
                const indicator = document.getElementById('status-indicator');
                indicator.className = `status-dot absolute bottom-1 right-1 rounded-full ${statusMap[data.discord_status]}`;
                if(data.discord_status !== 'offline') indicator.classList.add('pulse');

                // Custom Status
                const customStatus = data.activities.find(a => a.type === 4);
                document.getElementById('custom-status').innerText = customStatus ? customStatus.state : 'No status set';

                // Activity / Gaming
                const activity = data.activities.find(a => a.type === 0);
                const activityText = document.getElementById('activity-name');
                if (activity) {
                    activityText.innerText = `Oynuyor: ${activity.name}`;
                    activityText.classList.add('text-indigo-300');
                } else {
                    activityText.innerText = 'Şu an bir şey yapmıyor';
                    activityText.classList.remove('text-indigo-300');
                }

                // Spotify Logic
                const spotifyContainer = document.getElementById('spotify-container');
                if (data.listening_to_spotify) {
                    spotifyContainer.classList.remove('hidden');
                    document.getElementById('spotify-album').src = data.spotify.album_art_url;
                    document.getElementById('spotify-title').innerText = data.spotify.track;
                    document.getElementById('spotify-artist').innerText = data.spotify.artist;
                } else {
                    spotifyContainer.classList.add('hidden');
                }

                lucide.createIcons();
            } catch (error) {
                console.error("Lanyard Hatası:", error);
            }
        }

        // İlk yükleme ve her 30 saniyede bir güncelle
        fetchLanyard();
        setInterval(fetchLanyard, 30000);
    </script>
</body>
</html>
